# Configuración del Puerto del Servidor
server.port=8080
spring.application.name=catalogo

# Conexión a RabbitMQ Broker (Clúster Pedidos360)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360_pass}

# Topología Centralizada de Mensajería Pedidos360
pedidos360.rabbitmq.exchange.pedidos=pedidos.exchange
pedidos360.rabbitmq.exchange.dlx=pedidos.dlx.exchange
pedidos360.rabbitmq.queue.stock=pedidos.stock.queue
pedidos360.rabbitmq.queue.stock-dlq=pedidos.stock.dlq
pedidos360.rabbitmq.routing-key.creado=pedidos.pedido.creado
pedidos360.rabbitmq.routing-key.stock-dlq=pedidos.stock.dlq

# Configuración de OAuth2 / Resource Server con Microsoft Entra ID (Azure)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
